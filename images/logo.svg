<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110" fill="none">
  <defs>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d6"/>
      <stop offset="30%" stop-color="#e2ba66"/>
      <stop offset="70%" stop-color="#b88628"/>
      <stop offset="100%" stop-color="#f5dfaa"/>
    </linearGradient>
    <linearGradient id="bronzeG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0be88"/>
      <stop offset="60%" stop-color="#996328"/>
      <stop offset="100%" stop-color="#543310"/>
    </linearGradient>
    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Lotus Medallion -->
  <g transform="translate(55, 55)">
    <circle r="46" stroke="url(#goldG)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6"/>
    <circle r="40" stroke="url(#bronzeG)" stroke-width="1.5"/>
    <circle r="33" stroke="url(#goldG)" stroke-width="1"/>

    <!-- Lotus Petals -->
    <path d="M0 -33 C7 -24, 15 -10, 0 0 C-15 -10, -7 -24, 0 -33 Z" fill="url(#goldG)" opacity="0.85"/>
    <path d="M0 33 C7 24, 15 10, 0 0 C-15 10, -7 24, 0 33 Z" fill="url(#goldG)" opacity="0.85"/>
    <path d="M-33 0 C-24 7, -10 15, 0 0 C-10 -15, -24 -7, -33 0 Z" fill="url(#goldG)" opacity="0.85"/>
    <path d="M33 0 C24 7, 10 15, 0 0 C10 -15, 24 -7, 33 0 Z" fill="url(#goldG)" opacity="0.85"/>

    <path d="M-23 -23 C-14 -10, -5 -4, 0 0 C-4 -5, -10 -14, -23 -23 Z" fill="url(#bronzeG)" opacity="0.75"/>
    <path d="M23 -23 C14 -10, 5 -4, 0 0 C4 -5, 10 -14, 23 -23 Z" fill="url(#bronzeG)" opacity="0.75"/>
    <path d="M-23 23 C-14 10, -5 4, 0 0 C-4 5, -10 14, -23 23 Z" fill="url(#bronzeG)" opacity="0.75"/>
    <path d="M23 23 C14 10, 5 4, 0 0 C4 5, 10 14, 23 23 Z" fill="url(#bronzeG)" opacity="0.75"/>

    <!-- Inner Core with MH Monogram -->
    <circle r="20" fill="#140f0a" stroke="url(#goldG)" stroke-width="1.8"/>
    <text x="0" y="7" font-family="'Cinzel', 'Times New Roman', serif" font-size="15" font-weight="800" fill="url(#goldG)" text-anchor="middle" letter-spacing="1">MH</text>
  </g>

  <!-- Typography Brand Mark -->
  <g transform="translate(122, 0)">
    <text x="0" y="48" font-family="'Cinzel', 'Times New Roman', serif" font-size="24" font-weight="700" letter-spacing="4.5" fill="url(#goldG)">MADHURI</text>
    <text x="0" y="72" font-family="'Cinzel', 'Times New Roman', serif" font-size="15" font-weight="500" letter-spacing="5.5" fill="#fdfaf3">HANDICRAFTS</text>
    
    <line x1="0" y1="84" x2="230" y2="84" stroke="url(#bronzeG)" stroke-width="1" opacity="0.8"/>
    <circle cx="115" cy="84" r="2.5" fill="url(#goldG)"/>

    <text x="0" y="98" font-family="'Manrope', sans-serif" font-size="8.5" font-weight="700" letter-spacing="3" fill="url(#goldG)" opacity="0.9">TIMELESS ARTISANAL HERITAGE</text>
  </g>
</svg>
