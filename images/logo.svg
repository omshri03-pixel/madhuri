<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc9"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#eed58e"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9ad6d"/>
      <stop offset="50%" stop-color="#b3814f"/>
      <stop offset="100%" stop-color="#8c5828"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Mandala Emblem -->
  <g transform="translate(60, 60)">
    <!-- Outer concentric dashed / dotted ring -->
    <circle r="44" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.65"/>
    <circle r="38" stroke="url(#bronzeGrad)" stroke-width="1" opacity="0.8"/>
    <circle r="32" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Lotus / Artisan Petals -->
    <path d="M0 -32 C8 -24, 16 -12, 0 0 C-16 -12, -8 -24, 0 -32 Z" fill="url(#goldGrad)" opacity="0.75"/>
    <path d="M0 32 C8 24, 16 12, 0 0 C-16 12, -8 24, 0 32 Z" fill="url(#goldGrad)" opacity="0.75"/>
    <path d="M-32 0 C-24 8, -12 16, 0 0 C-12 -16, -24 -8, -32 0 Z" fill="url(#goldGrad)" opacity="0.75"/>
    <path d="M32 0 C24 8, 12 16, 0 0 C12 -16, 24 -8, 32 0 Z" fill="url(#goldGrad)" opacity="0.75"/>

    <path d="M-22 -22 C-14 -10, -4 -4, 0 0 C-4 -4, -10 -14, -22 -22 Z" fill="url(#bronzeGrad)" opacity="0.6"/>
    <path d="M22 -22 C14 -10, 4 -4, 0 0 C4 -4, 10 -14, 22 -22 Z" fill="url(#bronzeGrad)" opacity="0.6"/>
    <path d="M-22 22 C-14 10, -4 4, 0 0 C-4 4, -10 14, -22 22 Z" fill="url(#bronzeGrad)" opacity="0.6"/>
    <path d="M22 22 C14 10, 4 4, 0 0 C4 4, 10 14, 22 22 Z" fill="url(#bronzeGrad)" opacity="0.6"/>

    <!-- Center Medallion with Monogram MH -->
    <circle r="19" fill="#130c05" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Cinzel', 'Fraunces', serif" font-size="14" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">MH</text>
  </g>

  <!-- Typography Brand Identity -->
  <g transform="translate(130, 0)">
    <text x="0" y="52" font-family="'Cinzel', 'Fraunces', serif" font-size="24" font-weight="600" letter-spacing="4.5" fill="url(#goldGrad)">MADHURI</text>
    <text x="0" y="76" font-family="'Cinzel', 'Fraunces', serif" font-size="16" font-weight="400" letter-spacing="5.5" fill="#f6f1e7">HANDICRAFTS</text>
    
    <!-- Accent Line -->
    <line x1="0" y1="88" x2="230" y2="88" stroke="url(#bronzeGrad)" stroke-width="1" opacity="0.6"/>
    <circle cx="115" cy="88" r="2.5" fill="url(#goldGrad)"/>

    <text x="0" y="104" font-family="'Manrope', sans-serif" font-size="9" font-weight="600" letter-spacing="3.2" fill="url(#goldGrad)" opacity="0.9">TIMELESS ARTISANAL HERITAGE</text>
  </g>
</svg>
